[tool.poetry]
name = "Raspberry Pi Camera 2 - (PiCam2)"
version = "0.0.0"
description = "Raspberry Pi Pi Camera Project for Front Door InterCom Automation"
authors = ["Oliver Drechsler <https://github.com/oliverdrechsler>"]

[tool.poetry.dependencies]
python = ">=3.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[scripts]
install = """
#!/bin/bash
python -m venv venv
source venv/bin/activate
pip install -r requirements.txt
"""
start = """
#!/bin/bash
source venv/bin/activate
python foto_api.py
"""